name: Portable tests and workflow lint
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate every workflow
        run: |
          set -o pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color 2>&1 | tee actionlint.log
      - name: Expose workflow errors through the checks API
        if: failure()
        run: python3 tools/ci/report_failure.py actionlint.log
      - name: Test import, input and BC texture decoding under ASan and UBSan
        run: |
          mkdir -p build/portable-tests
          g++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            runtime/tests/native_tests.cpp runtime/gpu/bcn_decode.cpp runtime/android/touch_state.cpp \
            runtime/host/stfs_extract.cpp -pthread -o build/portable-tests/cz_portable_tests
          build/portable-tests/cz_portable_tests build/portable-tests/fixtures
      - name: Test APK verification, translations and build-mode guards
        run: python3 -m unittest discover -s tools/tests -v

  launcher:
    name: Launcher JVM tests and Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch matching SDL Java API and SDK (no native build required)
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          python3 - <<'PYTHON'
          from tools.android.bootstrap import sync, LOCK, ROOT
          sync('sdl', LOCK['sdl'], ROOT / 'thirdparty/android')
          PYTHON
      - name: Compile launcher, run importer tests and lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDiagnosticDebugUnitTest lintDiagnosticDebug 2>&1 | tee ../launcher-tests.log
      - name: Expose launcher errors through the checks API
        if: failure()
        run: python3 tools/ci/report_failure.py launcher-tests.log android/app/build/reports/lint-results-*.txt
      - name: Keep JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-tests
          if-no-files-found: ignore
          path: |
            launcher-tests.log
            android/app/build/reports/
            android/app/build/test-results/
